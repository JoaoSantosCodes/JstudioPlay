services:
  jstudioplay:
    container_name: mcp_jstudioplay
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - CREDENCIAIS/.env
    environment:
      - PORT=3030
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
