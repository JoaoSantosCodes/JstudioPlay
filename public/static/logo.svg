<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="jsp-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28A3C"/>
      <stop offset="55%" stop-color="#FFC08F"/>
      <stop offset="100%" stop-color="#6AA6FF"/>
    </linearGradient>
    <linearGradient id="jsp-grad-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFC08F"/>
    </linearGradient>
    <filter id="jsp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Icon Body -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#141517" stroke="url(#jsp-grad-main)" stroke-width="2"/>
  
  <!-- Stylized J Studio Monogram with Play Symbol -->
  <!-- Upper Bar of J / Studio Wave -->
  <path d="M18 16 H38 C42.4 16 46 19.6 46 24 C46 28.4 42.4 32 38 32 H34" 
        stroke="url(#jsp-grad-main)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- J Stem and Curved Base -->
  <path d="M34 20 V38 C34 44.6 28.6 50 22 50 C16.5 50 12 45.5 12 40" 
        stroke="url(#jsp-grad-main)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered Futuristic Play Button -->
  <path d="M26 22 L42 32 L26 42 Z" fill="url(#jsp-grad-play)" filter="url(#jsp-glow)"/>
  
  <!-- Accent Dot -->
  <circle cx="46" cy="18" r="3" fill="#F28A3C"/>
</svg>
