services:
  jstudioplay:
    container_name: mcp_jstudioplay
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - CREDENCIAIS/.env
    environment:
      - PORT=3030
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/api/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mcp_cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./CREDENCIAIS/cloudflare-tunnel:/etc/cloudflared:ro
    networks:
      - mcp-network
    depends_on:
      jstudioplay:
        condition: service_healthy

networks:
  mcp-network:
    external: true
