<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141517">
  <meta name="description" content="JstudioPlay é a sua central definitiva de streaming IPTV, player HLS de alta fidelidade e organizador inteligente de playlists.">
  <title>JstudioPlay — TV, Cinema & Streaming</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=7.7.4">
  <link rel="stylesheet" href="/static/automation.css?v=7.7.4">
  <link rel="stylesheet" href="/static/design-v8.css?v=7.7.4">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script defer src="/static/app.js?v=7.7.4"></script>
  <script defer src="/static/automation.js?v=7.7.4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) reg.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => {
        for (const k of keys) caches.delete(k);
      });
    }
  </script>
</head>
<body>
  <div id="app"><div class="boot"><img src="/static/logo.svg" width="56" height="56" alt="JstudioPlay"><p>Iniciando JstudioPlay…</p></div></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Ative o JavaScript para usar o JstudioPlay.</noscript>
</body>
</html>
